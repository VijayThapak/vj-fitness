name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android and iOS project files
        run: |
          flutter create --org com.vjfit --project-name vj_fit --platforms android,ios .
          rm -f test/widget_test.dart

      - name: Apply app name, permissions and signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: python3 tool/setup_platforms.py

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk VJ-Fit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VJ-Fit-apk
          path: VJ-Fit.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VJ Fit 1.0.${{ github.run_number }}
          make_latest: true
          files: VJ-Fit.apk
          body: |
            Download **VJ-Fit.apk** below and open it on your Android phone to install.
            If Android asks, allow "Install unknown apps" for your browser or file manager.
            Installing a newer version keeps your data.
