name: Build Android APK and website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android and iOS project files
        shell: bash
        run: |
          flutter create --org com.vjfit --project-name vj_fit --platforms android,ios . 2>&1 | tee -a ci-log.txt
          rm -f test/widget_test.dart

      - name: Apply app name, permissions and signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: python3 tool/setup_platforms.py

      - name: Get packages
        shell: bash
        run: flutter pub get 2>&1 | tee -a ci-log.txt

      - name: App icon
        shell: bash
        run: dart run flutter_launcher_icons 2>&1 | tee -a ci-log.txt

      - name: Check code
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci-log.txt
        continue-on-error: true

      - name: Build APK
        shell: bash
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tee -a ci-log.txt

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk VJ-Fit.apk

      - name: Check APK signature
        shell: bash
        run: |
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --verbose --print-certs VJ-Fit.apk 2>&1 | grep -v WARNING | tee -a ci-log.txt
          "$SIGNER" verify --verbose VJ-Fit.apk | grep -q "v1 scheme (JAR signing): true"
          "$SIGNER" verify --verbose VJ-Fit.apk | grep -q "v2 scheme (APK Signature Scheme v2): true"

      - uses: actions/upload-artifact@v4
        with:
          name: VJ-Fit-apk
          path: VJ-Fit.apk

      - name: Save build log to the ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/cilog
          { echo "run ${{ github.run_number }} commit ${{ github.sha }}"; flutter --version 2>&1; cat ci-log.txt 2>/dev/null; } > /tmp/cilog/ci-log.txt
          cp pubspec.lock /tmp/cilog/ 2>/dev/null || true
          cd /tmp/cilog
          git init -q && git checkout -q -b ci-logs && git add .
          git -c user.name="VJ Fit CI" -c user.email="ci@vjfit.invalid" commit -qm "Build log for run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VJ Fit 1.0.${{ github.run_number }}
          make_latest: true
          files: VJ-Fit.apk
          body: |
            Download **VJ-Fit.apk** below and open it on your Android phone to install.
            If Android asks, allow "Install unknown apps" for your browser or file manager.
            Installing a newer version keeps your data.

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web project files
        shell: bash
        run: |
          # Android/iOS folders are created too because the icon tool updates all of them.
          flutter create --org com.vjfit --project-name vj_fit --platforms android,ios,web . 2>&1 | tee -a web-log.txt
          rm -f test/widget_test.dart

      - name: Get packages
        shell: bash
        run: flutter pub get 2>&1 | tee -a web-log.txt

      - name: App icon
        shell: bash
        run: dart run flutter_launcher_icons 2>&1 | tee -a web-log.txt

      - name: Apply app name and colours
        run: python3 tool/setup_platforms.py --web

      - name: Build website
        shell: bash
        run: |
          set -o pipefail
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" \
            --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} 2>&1 | tee -a web-log.txt
          touch build/web/.nojekyll

      - name: Open the site in Chrome and take screenshots
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p /tmp/serve /tmp/weblog
          cp -r build/web "/tmp/serve/${{ github.event.repository.name }}"
          (cd /tmp/serve && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          URL="http://localhost:8080/${{ github.event.repository.name }}/"
          for size in 390,844 1280,800; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=$size --force-device-scale-factor=1 --virtual-time-budget=20000 \
              --enable-logging=stderr --v=0 --screenshot="/tmp/weblog/screen-${size/,/x}.png" "$URL" \
              2> "/tmp/weblog/chrome-${size/,/x}.txt" || true
          done
          grep -h "CONSOLE\|Uncaught\|ERROR:" /tmp/weblog/chrome-*.txt | grep -v "gpu\|dbus\|sandbox" | head -40 > /tmp/weblog/console.txt || true
          ls -la /tmp/weblog

      - name: Save build log to the ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/weblog && cd /tmp/weblog
          git init -q && git checkout -q -b ci-logs-web
          { echo "run ${{ github.run_number }} commit ${{ github.sha }}"; cat "$GITHUB_WORKSPACE/web-log.txt" 2>/dev/null; } > web-log.txt
          git add . && git -c user.name="VJ Fit CI" -c user.email="ci@vjfit.invalid" commit -qm "Web build log for run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deploy
        uses: actions/deploy-pages@v4
