name: vj_fit
description: VJ Fit - workout plans, exercise library and vegetarian diet charts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  wakelock_plus: ^1.2.8
  file_picker: '>=8.1.4 <11.0.0'

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/ex/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1F5FBF"
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21
